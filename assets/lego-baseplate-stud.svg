<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <!-- Soft shadow on the baseplate floor under the stud -->
    <radialGradient id="baseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Cylindrical Stud Lighting (light from top-left, shadow on bottom-right) -->
    <linearGradient id="studCylinder" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Top face of the stud: slight convex top dome with highlight -->
    <radialGradient id="studTopFace" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>

    <!-- Center circular Lego logo ring emboss -->
    <linearGradient id="embossRing" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- 1. Cast shadow onto baseplate (offset towards bottom-right) -->
  <ellipse cx="20" cy="20.5" rx="11.5" ry="11" fill="url(#baseShadow)" />

  <!-- 2. Stud Wall / Outer 3D Cylinder Edge -->
  <circle cx="18" cy="18" r="10.5" fill="url(#studCylinder)" />

  <!-- 3. Stud Top Circular Surface (slightly elevated towards top-left) -->
  <circle cx="18" cy="17.2" r="9.6" fill="url(#studTopFace)" />

  <!-- 4. Crisp Inner Embossed Stud Ring (mimicking classic LEGO stud circular recess) -->
  <circle cx="18" cy="17.2" r="5.6" fill="none" stroke="url(#embossRing)" stroke-width="1.2" />

  <!-- 5. Tiny center highlight dot for plastic specular shine -->
  <circle cx="16.5" cy="15.8" r="1.4" fill="#ffffff" fill-opacity="0.4" />
</svg>