<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <mask id="studMask">
      <rect width="24" height="24" fill="#ffffff"/>
      <circle cx="11.5" cy="11.5" r="4.8" fill="#000000"/>
    </mask>
  </defs>
  <!-- Small shadow cast to the bottom-right (SE) -->
  <circle cx="12.9" cy="12.9" r="4.8" fill="#000000" opacity="0.28" mask="url(#studMask)"/>
  <!-- Circle rim highlight on NW -->
  <circle cx="11.5" cy="11.5" r="4.8" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.75"/>
</svg>